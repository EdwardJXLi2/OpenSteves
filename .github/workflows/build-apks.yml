name: Build APKs

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4

      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-36.1" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          cache-provider: basic

      - name: Build debug APK and run unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Restore release keystore
        if: github.event_name != 'pull_request'
        env:
          OPENSTEVES_KEYSTORE_BASE64: ${{ secrets.OPENSTEVES_KEYSTORE_BASE64 }}
          OPENSTEVES_KEYSTORE_PASSWORD: ${{ secrets.OPENSTEVES_KEYSTORE_PASSWORD }}
          OPENSTEVES_KEY_ALIAS: ${{ secrets.OPENSTEVES_KEY_ALIAS }}
          OPENSTEVES_KEY_PASSWORD: ${{ secrets.OPENSTEVES_KEY_PASSWORD }}
        run: |
          if [ -z "$OPENSTEVES_KEYSTORE_BASE64" ] || [ -z "$OPENSTEVES_KEYSTORE_PASSWORD" ] || [ -z "$OPENSTEVES_KEY_ALIAS" ] || [ -z "$OPENSTEVES_KEY_PASSWORD" ]; then
            echo "::error::Configure the four OPENSTEVES release signing repository secrets listed in README.md."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/keystores"
          printf '%s' "$OPENSTEVES_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/keystores/opensteves-release.jks"
          chmod 600 "$RUNNER_TEMP/keystores/opensteves-release.jks"

      - name: Build signed release APK
        if: github.event_name != 'pull_request'
        env:
          OPENSTEVES_KEYSTORE_FILE: ${{ runner.temp }}/keystores/opensteves-release.jks
          OPENSTEVES_KEYSTORE_PASSWORD: ${{ secrets.OPENSTEVES_KEYSTORE_PASSWORD }}
          OPENSTEVES_KEY_ALIAS: ${{ secrets.OPENSTEVES_KEY_ALIAS }}
          OPENSTEVES_KEY_PASSWORD: ${{ secrets.OPENSTEVES_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Stage debug APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/opensteves-debug-latest.apk

      - name: Verify and stage release APK
        if: github.event_name != 'pull_request'
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk dist/opensteves-release-latest.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: opensteves-apks
          path: dist/*.apk
          if-no-files-found: error

      - name: Remove release keystore
        if: always() && github.event_name != 'pull_request'
        run: rm -f "$RUNNER_TEMP/keystores/opensteves-release.jks"

  publish-latest:
    name: Publish latest release
    runs-on: ubuntu-24.04
    needs: build
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    concurrency:
      group: latest-apk-release
      cancel-in-progress: false

    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: opensteves-apks
          path: dist

      - name: Publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -f dist/opensteves-debug-latest.apk
          test -f dist/opensteves-release-latest.apk
          gh release delete latest --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/latest" || true
          gh release create latest dist/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Latest Build" \
            --notes "Debug and signed release APKs for $GITHUB_SHA. Requires Android 8.0 (API 26) or later." \
            --latest

  publish-apk-repository:
    name: Publish to APK Repository
    runs-on: ubuntu-24.04
    needs: build
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
    concurrency:
      group: apk-repository-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: opensteves-apks
          path: dist

      - name: Upload release APK to APK Repository
        env:
          APK_REPOSITORY_URL: ${{ secrets.APK_REPOSITORY_URL }}
          APK_REPOSITORY_API_KEY: ${{ secrets.APK_REPOSITORY_API_KEY }}
        run: |
          if [ -z "$APK_REPOSITORY_URL" ]; then
            echo "::error::Missing APK_REPOSITORY_URL repository secret."
            exit 1
          fi
          if [ -z "$APK_REPOSITORY_API_KEY" ]; then
            echo "::error::Missing APK_REPOSITORY_API_KEY repository secret."
            exit 1
          fi
          apk="dist/opensteves-release-latest.apk"
          if [ ! -f "$apk" ]; then
            echo "::error::No release APK found in downloaded artifacts."
            exit 1
          fi
          base_url="${APK_REPOSITORY_URL%/}"
          curl --fail-with-body \
            -H "Authorization: Bearer ${APK_REPOSITORY_API_KEY}" \
            -F "apk=@${apk};type=application/vnd.android.package-archive" \
            -F 'metadata={"release_channel":"release"}' \
            "${base_url}/api/v1/upload"
